[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demonx-forge-sdk"
version = "0.1.0"
description = "Python SDK for versioned DemonX Forge scripts through its authenticated MCP bridge"
requires-python = ">=3.10"
dependencies = []
license = { text = "GPL-3.0-or-later" }

[tool.setuptools.packages.find]
where = ["."]
include = ["demonx_forge*"]
