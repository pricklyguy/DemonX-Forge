name: Native Windows signed preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: New DemonX Forge preview version, for example 0.1.0-preview.1
        required: true
        type: string
      publish:
        description: Sign and publish a GitHub prerelease (leave false for validation runs)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-native-test-archive:
    name: Build complete native Windows test archive
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Require the approved fusion parity branch
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/codex/fusion-parity') { throw 'Native preview builds may run only from codex/fusion-parity.' }
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Require read-only SolidCraft source access
        shell: pwsh
        env:
          SOLIDCRAFT_READ_TOKEN: ${{ secrets.SOLIDCRAFT_READ_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SOLIDCRAFT_READ_TOKEN)) {
            throw 'Configure SOLIDCRAFT_READ_TOKEN with read-only Contents access to pricklyguy/DemonX-Solidcraft.'
          }
      - uses: actions/checkout@v7
        with:
          repository: pricklyguy/DemonX-Solidcraft
          ref: 75261cd79733fe47cf898b54f865e6bfaffa1129
          token: ${{ secrets.SOLIDCRAFT_READ_TOKEN }}
          path: prototype/solidcraft
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Forge MCP regression tests
        run: npm run test --workspace server -- test/mcp.test.ts
      - name: Type-check Forge MCP transport
        run: node_modules/.bin/tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --strict --skipLibCheck --types node prototype/mcp-native.ts
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.145
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: prototype/solidcraft
          shared-key: native-windows-x64
          cache-on-failure: true
      - name: Require pinned release verification key
        shell: pwsh
        env:
          DEMONX_FORGE_UPDATE_PUBLIC_KEY: ${{ vars.DEMONX_FORGE_UPDATE_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DEMONX_FORGE_UPDATE_PUBLIC_KEY)) {
            throw 'Set the repository Actions variable DEMONX_FORGE_UPDATE_PUBLIC_KEY to the minisign public key base64 line.'
          }
          $keys = $env:DEMONX_FORGE_UPDATE_PUBLIC_KEY -split ';'
          if ($keys.Count -eq 0 -or @($keys | Where-Object { $_ -notmatch '^R[WS][A-Za-z0-9+/=]+$' }).Count -gt 0) {
            throw 'DEMONX_FORGE_UPDATE_PUBLIC_KEY must contain minisign base64 public keys separated by semicolons.'
          }
      - name: Record known pinned upstream Windows baseline
        continue-on-error: true
        shell: pwsh
        working-directory: prototype/solidcraft
        run: |
          $filters = @(
            'recovery::tests::recovery_dirs_and_their_legacy_names',
            'robustness_goldens::seed_13',
            'robustness_goldens::seed_23',
            'robustness_goldens::seed_36',
            'robustness_goldens::seed_67'
          )
          $failed = @()
          foreach ($filter in $filters) {
            Write-Host "::group::Pinned upstream baseline: $filter"
            & cargo test --profile ci --locked -p solidcraft-engine --lib $filter
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code -ne 0) { $failed += $filter }
          }
          "## Pinned unmodified SolidCraft Windows baseline" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          if ($failed.Count -eq 0) {
            'All five focused baseline tests passed.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          } else {
            "Focused baseline failures: $($failed -join ', ')" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Write-Host "::warning::Pinned upstream baseline failures: $($failed -join ', ')"
            exit 1
          }
      - name: Check overlay anchors
        run: node prototype/apply-overlay.mjs --check prototype/solidcraft
      - name: Apply Forge identity and secure updater overlay
        run: node prototype/apply-overlay.mjs prototype/solidcraft
      - name: Build complete native test archive
        working-directory: prototype/solidcraft
        env:
          SOLIDCRAFT_GPU: software
          SOLIDCRAFT_REQUIRE_GPU: '1'
          WGPU_BACKEND: dx12
          WGPU_DX12_COMPILER: fxc
        run: cargo nextest archive --workspace --cargo-profile ci --locked --archive-file "${{ runner.temp }}\native-windows-tests.tar.zst"
      - name: Verify complete, disjoint test-shard union
        run: node prototype/verify-nextest-shards.mjs "${{ runner.temp }}\native-windows-tests.tar.zst" 4
      - uses: actions/upload-artifact@v7
        with:
          name: native-windows-tests-${{ github.sha }}
          path: ${{ runner.temp }}/native-windows-tests.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  native-source-test:
    name: Run native source and UI shard ${{ matrix.shard }}/4
    needs: build-native-test-archive
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Require the approved fusion parity branch
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/codex/fusion-parity') { throw 'Native preview builds may run only from codex/fusion-parity.' }
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Require read-only SolidCraft source access
        shell: pwsh
        env:
          SOLIDCRAFT_READ_TOKEN: ${{ secrets.SOLIDCRAFT_READ_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SOLIDCRAFT_READ_TOKEN)) {
            throw 'Configure SOLIDCRAFT_READ_TOKEN with read-only Contents access to pricklyguy/DemonX-Solidcraft.'
          }
      - uses: actions/checkout@v7
        with:
          repository: pricklyguy/DemonX-Solidcraft
          ref: 75261cd79733fe47cf898b54f865e6bfaffa1129
          token: ${{ secrets.SOLIDCRAFT_READ_TOKEN }}
          path: prototype/solidcraft
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.145
      - name: Apply Forge identity and secure updater overlay
        run: node prototype/apply-overlay.mjs prototype/solidcraft
      - uses: actions/download-artifact@v7
        with:
          name: native-windows-tests-${{ github.sha }}
          path: ${{ runner.temp }}\native-windows-tests
      - name: Run complete test shard
        working-directory: prototype/solidcraft
        env:
          SOLIDCRAFT_GPU: software
          SOLIDCRAFT_REQUIRE_GPU: '1'
          WGPU_BACKEND: dx12
          WGPU_DX12_COMPILER: fxc
        run: cargo nextest run --archive-file "${{ runner.temp }}\native-windows-tests\native-windows-tests.tar.zst" --workspace-remap "$env:GITHUB_WORKSPACE\prototype\solidcraft" --partition "slice:${{ matrix.shard }}/4" --no-fail-fast

  build-test-package:
    name: Build and test native Windows x64 package
    needs: native-source-test
    # The package script requires the VS 2022 MSVC environment. Pin this instead of
    # windows-latest, which now tracks the VS 2026 runner image.
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Require the approved fusion parity branch
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/codex/fusion-parity') { throw 'Native preview builds may run only from codex/fusion-parity.' }
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Require read-only SolidCraft source access
        shell: pwsh
        env:
          SOLIDCRAFT_READ_TOKEN: ${{ secrets.SOLIDCRAFT_READ_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SOLIDCRAFT_READ_TOKEN)) {
            throw 'Configure SOLIDCRAFT_READ_TOKEN with read-only Contents access to pricklyguy/DemonX-Solidcraft.'
          }
      - uses: actions/checkout@v7
        with:
          repository: pricklyguy/DemonX-Solidcraft
          ref: 75261cd79733fe47cf898b54f865e6bfaffa1129
          token: ${{ secrets.SOLIDCRAFT_READ_TOKEN }}
          path: prototype/solidcraft
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Forge MCP regression tests
        run: npm run test --workspace server -- test/mcp.test.ts
      - name: Type-check Forge MCP transport
        run: node_modules/.bin/tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --strict --skipLibCheck --types node prototype/mcp-native.ts
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: prototype/solidcraft
          shared-key: native-windows-x64
          cache-on-failure: true
      - name: Require pinned release verification key
        shell: pwsh
        env:
          DEMONX_FORGE_UPDATE_PUBLIC_KEY: ${{ vars.DEMONX_FORGE_UPDATE_PUBLIC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DEMONX_FORGE_UPDATE_PUBLIC_KEY)) {
            throw 'Set the repository Actions variable DEMONX_FORGE_UPDATE_PUBLIC_KEY to the minisign public key base64 line.'
          }
          $keys = $env:DEMONX_FORGE_UPDATE_PUBLIC_KEY -split ';'
          if ($keys.Count -eq 0 -or @($keys | Where-Object { $_ -notmatch '^R[WS][A-Za-z0-9+/=]+$' }).Count -gt 0) {
            throw 'DEMONX_FORGE_UPDATE_PUBLIC_KEY must contain minisign base64 public keys separated by semicolons.'
          }
      - name: Check overlay anchors
        run: node prototype/apply-overlay.mjs --check prototype/solidcraft
      - name: Apply Forge identity and secure updater overlay
        run: node prototype/apply-overlay.mjs prototype/solidcraft
      - name: Verify branding and updater policy
        run: |
          node prototype/verify-overlay.mjs prototype/solidcraft
      - name: Locate Visual Studio compiler environment
        id: vs
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $install = & $vswhere -latest -products '*' -property installationPath
          if (-not $install) { throw 'Visual Studio 2022 was not found on this runner.' }
          "path=$install\Common7\Tools\VsDevCmd.bat" >> $env:GITHUB_OUTPUT
      - name: Build Windows native package
        shell: pwsh
        env:
          DEMONX_FORGE_UPDATE_PUBLIC_KEY: ${{ vars.DEMONX_FORGE_UPDATE_PUBLIC_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP 'demonx-forge-package'
          & prototype/package-windows.ps1 -Arch x64 -OutputDirectory $packageRoot -BuildSource (Join-Path $PWD 'prototype\solidcraft') -VsDevCmdPath '${{ steps.vs.outputs.path }}' -ReleaseVersion $env:RELEASE_VERSION
          $archive = Get-ChildItem -LiteralPath $packageRoot -Filter '*.zip' | Select-Object -First 1
          if (-not $archive) { throw 'Package script did not produce a ZIP archive.' }
          Copy-Item -LiteralPath $archive.FullName -Destination (Join-Path $packageRoot 'DemonX-Forge-native-windows-x64-portable.zip')
          "package_root=$packageRoot" >> $env:GITHUB_OUTPUT
        id: package
      - name: Run packaged GUI, native command, and MCP acceptance
        run: node prototype/native-acceptance.mjs "${{ steps.package.outputs.package_root }}\DemonXForge.exe" "${{ steps.package.outputs.package_root }}\forge-mcp-native.mjs"
      - uses: actions/upload-artifact@v7
        with:
          name: native-windows-preview-${{ inputs.version }}
          path: ${{ runner.temp }}/demonx-forge-package/DemonX-Forge-native-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 14

  sign-and-publish:
    name: Sign manifest and publish native preview release
    if: ${{ inputs.publish == true && github.ref == 'refs/heads/codex/fusion-parity' }}
    needs: build-test-package
    runs-on: windows-2022
    environment: native-preview
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          name: native-windows-preview-${{ inputs.version }}
          path: ${{ runner.temp }}/native-release
      - name: Require unique native tag and signing configuration
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DEMONX_FORGE_MINISIGN_SECRET_KEY: ${{ secrets.DEMONX_FORGE_MINISIGN_SECRET_KEY }}
          DEMONX_FORGE_UPDATE_PUBLIC_KEY: ${{ vars.DEMONX_FORGE_UPDATE_PUBLIC_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/codex/fusion-parity') { throw 'Native preview publishing is locked to codex/fusion-parity.' }
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+-preview\.\d+$') { throw 'Release version must be numeric semver with -preview.N.' }
          $tag = "native-v$($env:RELEASE_VERSION)"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release tag already exists: $tag" }
          $candidateParts = $env:RELEASE_VERSION -match '^(\d+)\.(\d+)\.(\d+)-preview\.(\d+)$'
          $candidate = [version]::new([int]$Matches[1], [int]$Matches[2], [int]$Matches[3], [int]$Matches[4])
          $existing = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not list existing GitHub releases to enforce monotonic versions.' }
          $nativeVersions = @($existing | ForEach-Object {
            if ($_.tag_name -match '^native-v(\d+)\.(\d+)\.(\d+)-preview\.(\d+)$') {
              [version]::new([int]$Matches[1], [int]$Matches[2], [int]$Matches[3], [int]$Matches[4])
            }
          } | Where-Object { $_ -is [version] })
          if ($nativeVersions.Count -gt 0 -and $candidate -le ($nativeVersions | Sort-Object -Descending | Select-Object -First 1)) {
            throw 'Release version must be strictly greater than every existing native preview release.'
          }
          if ([string]::IsNullOrWhiteSpace($env:DEMONX_FORGE_MINISIGN_SECRET_KEY)) { throw 'Set DEMONX_FORGE_MINISIGN_SECRET_KEY in the protected native-preview environment.' }
          if ([string]::IsNullOrWhiteSpace($env:DEMONX_FORGE_UPDATE_PUBLIC_KEY)) { throw 'Set DEMONX_FORGE_UPDATE_PUBLIC_KEY as a repository Actions variable.' }
      - name: Install pinned minisign verifier and signer
        shell: pwsh
        run: |
          $version = '0.12'
          $release = Invoke-RestMethod "https://api.github.com/repos/jedisct1/minisign/releases/tags/$version"
          $asset = $release.assets | Where-Object { $_.name -match 'win64\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "Official minisign $version release has no Win64 archive." }
          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest $asset.browser_download_url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'minisign')
          $binary = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'minisign') -Filter minisign.exe -Recurse | Select-Object -First 1
          if (-not $binary) { throw 'Pinned minisign archive did not contain minisign.exe.' }
          "MINISIGN=$($binary.FullName)" >> $env:GITHUB_ENV
      - name: Generate and sign native metadata
        shell: pwsh
        env:
          DEMONX_FORGE_MINISIGN_SECRET_KEY: ${{ secrets.DEMONX_FORGE_MINISIGN_SECRET_KEY }}
          DEMONX_FORGE_UPDATE_PUBLIC_KEY: ${{ vars.DEMONX_FORGE_UPDATE_PUBLIC_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP 'native-release'
          $keyFile = Join-Path $env:RUNNER_TEMP 'native-release.key'
          $derivedPub = Join-Path $env:RUNNER_TEMP 'derived-minisign.pub'
          $pubFile = Join-Path $env:RUNNER_TEMP 'trusted-minisign.pub'
          try {
            Set-Content -LiteralPath $keyFile -Value $env:DEMONX_FORGE_MINISIGN_SECRET_KEY -NoNewline -Encoding ascii
            & $env:MINISIGN -R -s $keyFile -p $derivedPub -W
            if ($LASTEXITCODE -ne 0) { throw 'Could not derive public key from signing key.' }
            $keyBase64 = (Get-Content -LiteralPath $derivedPub | Select-Object -Last 1).Trim()
            $trustedKeys = $env:DEMONX_FORGE_UPDATE_PUBLIC_KEY.Split(';') | ForEach-Object { $_.Trim() }
            if ($trustedKeys -cnotcontains $keyBase64) { throw 'Signing secret is not one of the public keys embedded in the build.' }
            Copy-Item -LiteralPath $derivedPub -Destination $pubFile
            $tag = "native-v$($env:RELEASE_VERSION)"
            node prototype/scripts/native-release.mjs create "--version=$($env:RELEASE_VERSION)" "--tag=$tag" "--archive=$(Join-Path $releaseDir 'DemonX-Forge-native-windows-x64-portable.zip')" "--out=$releaseDir"
            if ($LASTEXITCODE -ne 0) { throw 'Could not generate native release metadata.' }
            & $env:MINISIGN -S -s $keyFile -m (Join-Path $releaseDir 'SHA256SUMS.txt') -x (Join-Path $releaseDir 'SHA256SUMS.txt.minisig') -t $tag -W
            if ($LASTEXITCODE -ne 0) { throw 'Could not sign native release checksums.' }
            & $env:MINISIGN -Vm (Join-Path $releaseDir 'SHA256SUMS.txt') -p $pubFile -x (Join-Path $releaseDir 'SHA256SUMS.txt.minisig')
            if ($LASTEXITCODE -ne 0) { throw 'Local signature verification failed.' }
            $signature = Get-Content -Raw -LiteralPath (Join-Path $releaseDir 'SHA256SUMS.txt.minisig')
            if (-not $signature.Contains($tag)) { throw 'Signature trusted comment does not name the native release tag.' }
          } finally {
            Remove-Item -LiteralPath $keyFile -Force -ErrorAction SilentlyContinue
          }
      - name: Create manual native preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP 'native-release'
          $tag = "native-v$($env:RELEASE_VERSION)"
          $notes = @"
          DemonX Forge native Windows x64 preview.

          Channel: native-preview
          Tag: $tag
          Platform: windows-x64
          This release is manually published by the protected native-preview workflow. The signed release manifest and checksum list authenticate the package.
          "@
          Set-Content -LiteralPath (Join-Path $releaseDir 'release-notes.txt') -Value $notes -Encoding utf8
          gh release create $tag `
            (Join-Path $releaseDir 'DemonX-Forge-native-windows-x64-portable.zip') `
            (Join-Path $releaseDir 'DemonX-Forge-release.json') `
            (Join-Path $releaseDir 'SHA256SUMS.txt') `
            (Join-Path $releaseDir 'SHA256SUMS.txt.minisig') `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title "DemonX Forge $tag" --notes-file (Join-Path $releaseDir 'release-notes.txt')
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
